    .logo-main { fill: #46572D; transition: fill 0.25s ease; }
    .logo-diamond { fill: #8E541A; transition: fill 0.25s ease; }
    @media (prefers-color-scheme: dark) {
      .logo-main { fill: #94AE6B; }
      .logo-diamond { fill: #D99B4E; }
    }
    :root[data-theme="dark"] .logo-main { fill: #94AE6B; }
    :root[data-theme="dark"] .logo-diamond { fill: #D99B4E; }
