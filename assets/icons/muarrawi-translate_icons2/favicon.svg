<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .main-mark { fill: #4A5A30; }
      .accent-diamond { fill: #8E5A1E; }
      .wordmark-main {
        fill: #4A5A30;
        font-family: 'Cinzel', 'Trajan Pro', ' Marcellus', 'Georgia', serif;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: 6px;
        text-anchor: middle;
      }
      .wordmark-sub {
        fill: #4A5A30;
        font-family: 'Montserrat', 'Lato', 'Helvetica Neue', sans-serif;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 14px;
        text-anchor: middle;
      }
      @media (prefers-color-scheme: dark) {
        .main-mark, .wordmark-main, .wordmark-sub { fill: #F1E9DA; }
        .accent-diamond { fill: #C88A3E; }
      }
    </style>
  </defs>

  <!-- Optionaler Hintergrund (bei Bedarf fill="#F1E9DA" bzw. "#181D12" setzen) -->
  <rect class="bg" width="900" height="720" />

